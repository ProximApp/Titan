arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
untranslated-messages-file: missing.txt
# Ships each locale as its own lazily-loaded chunk instead of compiling every
# translation into the bundle that loads before the first frame. Both locales
# together are ~500 KB of generated source, and a visitor only ever needs one.
use-deferred-loading: true
