<!doctype html>
<!-- This index.prod.html file is similar to index.html, but defer the loading of pdf.js
-->

<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Application associative de {{ SCHOOL_NAME }}, développée par {{ ENTITY_NAME }}"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-title" content="{{ APP_NAME }}" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- There used to be preconnects to www.gstatic.com and fonts.gstatic.com
         here, for the renderer and for the engine's Roboto fallback. Neither is
         fetched any more: the build passes `--no-web-resources-cdn` so the
         renderer is served from this origin, and pubspec.yaml declares a
         `Roboto` family, which is the condition under which the engine skips its
         own download. A preconnect to an origin the page never uses is not free
         — it spends a connection slot and a DNS lookup during the busiest part
         of the load. fonts.gstatic.com is still reachable for the Noto fallbacks
         the engine fetches when a glyph is missing from every registered font,
         but that is rare and lazy, and not worth warming on every visit. -->

    <title>{{ APP_NAME }}</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
      }

      /* The splash is taken out of the flow so that Flutter attaching its own
         view underneath it shifts nothing: a splash that participates in layout
         is worth ~0.17 of Cumulative Layout Shift on its own. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 32px;
        background: #fff;
        z-index: 1000;
        transition: opacity 0.25s ease-out;
      }

      #splash.done {
        opacity: 0;
        pointer-events: none;
      }

      /* Real text, not decoration. The animated dots below are painted within
         ~150 ms but a browser does not count a coloured <div> as content, so
         without this the page measures as blank until Flutter's first frame —
         several seconds of First Contentful Paint that the user never saw. */
      #splash-title {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #111;
        margin: 0;
      }

      .container,
      .dot-container {
        position: relative;
        width: 100px;
        height: 100px;
      }

      .container {
        transform-origin: center;
        animation: anirotate 10s linear infinite;
      }

      .dot-container {
        position: absolute;
        border: 0px solid #fff;
        border-radius: 50px;
      }
      .dot-container:nth-child(2) {
        transform: rotate(40deg);
      }
      .dot-container:nth-child(2) .dot {
        animation-delay: -0.5s;
      }
      .dot-container:nth-child(3) {
        transform: rotate(80deg);
      }
      .dot-container:nth-child(3) .dot {
        animation-delay: -1s;
      }

      .dot {
        position: absolute;
        height: 10px;
        width: 10px;
        background: #000000;
        border-radius: 5px;
        transform: translate(0, 0);
      }
      .dot:nth-child(1) {
        top: 0;
        left: calc(50% - 5px);
        animation: ani1 2s infinite;
      }
      .dot:nth-child(2) {
        bottom: calc(28% - 5px);
        left: calc(11% - 5px);
        animation: ani2 2s infinite;
      }
      .dot:nth-child(3) {
        bottom: calc(28% - 5px);
        right: calc(11% - 5px);
        animation: ani3 2s infinite;
      }

      [hidden] {
        display: none;
      }

      @keyframes anirotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(-359deg);
        }
      }
      @keyframes ani1 {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(-40px, 67px);
        }
      }
      @keyframes ani2 {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(77px, 0);
        }
      }
      @keyframes ani3 {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(-39px, -67px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .container,
        .dot,
        #splash {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <p id="splash-title">{{ APP_NAME }}</p>
      <!-- https://codepen.io/oliverholretz/pen/Rgreaq -->
      <div class="container">
        <div class="dot-container">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="dot-container">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="dot-container">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <script>
      // pdf.js is ~92 KB from a third origin and only the PH module ever needs
      // it, so it is fetched the first time a PDF is opened rather than on
      // every single page load. `ensurePdfJs()` on the Dart side awaits this.
      window.loadPdfJs = function () {
        const version = "4.6.82";
        const base = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${version}`;
        window.__pdfJsPromise ??= import(`${base}/build/pdf.min.mjs`).then(
          (lib) => {
            // pdfx reads these two off the global scope, lazily, at the moment
            // it opens a document.
            globalThis.pdfjsLib ??= lib;
            globalThis.pdfjsLib.GlobalWorkerOptions.workerSrc = `${base}/build/pdf.worker.mjs`;
            globalThis.pdfRenderOptions = {
              cMapUrl: `${base}/cmaps/`,
              cMapPacked: true,
            };
          },
        );
        return window.__pdfJsPromise;
      };

      // Fired by the engine once it has painted; until then the splash is what
      // the user is looking at.
      window.addEventListener("flutter-first-frame", function () {
        const splash = document.getElementById("splash");
        if (!splash) return;
        splash.classList.add("done");
        splash.addEventListener("transitionend", () => splash.remove(), {
          once: true,
        });
        // Belt and braces: `transitionend` never fires when motion is reduced.
        setTimeout(() => splash.remove(), 400);
      });
    </script>
    <script>
      // The loader picks the WebAssembly build when the browser supports it and
      // falls back to the JavaScript one otherwise, so `--wasm` builds boot
      // without a second index.html. The placeholders are filled in at build
      // time by `flutter build web`.
      // prettier-ignore
      {{flutter_js}}
      // prettier-ignore
      {{flutter_build_config}}
      _flutter.loader.load();
    </script>
  </body>
</html>
