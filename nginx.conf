# Built into the image by the Dockerfile: nginx has no brotli support of its
# own, and brotli is worth ~23% over gzip on the Dart bundle.
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    server_tokens   off;
    keepalive_timeout  65;

    # The WebAssembly build ships `.mjs` modules, which nginx does not know
    # about and would otherwise serve as octet-stream, so the browser refuses
    # to run them.
    include mime.types;
    types {
      text/javascript mjs;
      # nginx's bundled mime.types predates these.
      font/ttf ttf;
      font/otf otf;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 9;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 512;
    gzip_types
      application/javascript
      text/javascript
      text/css
      text/plain
      font/woff2
      application/wasm
      application/json
      font/ttf
      image/svg+xml;
    gzip_static on;
    gunzip on;

    # Both the `.gz` and the `.br` copies are produced at build time, so nginx
    # only picks a file — it never spends CPU compressing a response. Clients
    # that do not advertise brotli transparently fall back to gzip.
    brotli_static on;

    server {
        listen 80;

        # HSTS settings
        # WARNING: Only add the preload option once you read about
        # the consequences in https://hstspreload.org/. This option
        # will add the domain to a hardcoded list that is shipped
        # in all major browsers and getting removed from this list
        # could take several months.
        #add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload;" always;

        # Remove X-Powered-By, which is an information leak
        fastcgi_hide_header X-Powered-By;

        # Path to the root of your installation
        root /app/html;
        
        # Redirect on 404 error
        error_page 404 @home;
        
        location @home {
            return 301 /;
        }
        
        # NOTE: nginx drops every inherited `add_header` as soon as a location
        # declares one of its own, so the WebAssembly headers below have to be
        # repeated in each location instead of being set once on the server.
        #
        # WebAssembly: these two headers also drive cross-origin isolation,
        # which we must NOT enable — it breaks popups, and popups are how both
        # login and HelloAsso funding work.

        location / {
            # The entry point decides which build the client runs, so it must
            # never be served from a stale cache.
            add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
            add_header Cross-Origin-Embedder-Policy 'credentialless' always;
            add_header Cross-Origin-Opener-Policy 'unsafe-none' always;

            try_files $uri $uri/ /index.html;
        }

        # The application payload is the bulk of the download — several MB of
        # `main.dart.wasm` / `main.dart.js`, deferred parts, fonts and images.
        # `no-store` forbids keeping any of it, so every single visit paid for
        # the whole app again. `no-cache` lets the browser keep it but forces a
        # conditional request on each load: unchanged files come back as a 304
        # of a few hundred bytes, and a new release still lands immediately
        # because revalidation is mandatory.
        location ~* \.(js|mjs|wasm|json|bin|otf|ttf|woff2|png|jpg|jpeg|webp|svg|symbols)$ {
            add_header Cache-Control 'no-cache' always;
            add_header Cross-Origin-Embedder-Policy 'credentialless' always;
            add_header Cross-Origin-Opener-Policy 'unsafe-none' always;

            try_files $uri $uri/ /index.html;
        }
    }
}