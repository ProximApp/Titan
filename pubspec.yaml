dev_dependencies:
  build_runner: ^2.9.0
  chopper_generator: ^8.4.0
  dependency_validator: ^5.0.3
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  mocktail: ^1.0.3
  path_provider_platform_interface: ^2.0.0
  plugin_platform_interface: ^2.0.0
  swagger_dart_code_generator:
    git:
      url: https://github.com/maximeroucher/swagger-dart-code-generator.git
      ref: master
  vector_math: ^2.1.2

flutter:
  assets:
    # Bundled Google Fonts, subset to the Latin ranges this app renders and
    # stripped of hinting: ~23 KB brotli each, against ~62 KB for the copy
    # Google's CDN serves. `google_fonts` picks these up from the asset
    # manifest and loads them lazily, so an unused weight costs nothing, and
    # the app no longer opens a connection to fonts.gstatic.com at all.
    - assets/google_fonts/
    - pubspec.yaml
    - assets/images/logo_prod.webp
    - assets/images/logo_alpha.webp
    - assets/images/logo_dev.webp
    - assets/images/gift.webp
    - assets/images/soli.webp
    - assets/images/proximapp.webp
    - assets/images/login.webp
    - assets/web/back.webp
    - assets/web/AMAP.webp
    - assets/web/Calendrier.webp
    - assets/web/Cine.webp
    - assets/web/Parametres.webp
    - assets/web/Pret.webp
    - assets/web/Tombola.webp
    - assets/web/Vote.webp
    - assets/emlyon/login.webp
    - assets/emlyon/back.webp
    # `assets/my_document.pdf` (200 KB) and `assets/images/logo_flappybird.svg`
    # used to be declared here but are referenced from nowhere in lib/, so they
    # were only ever dead weight in the image and two more asset-manifest
    # entries. The files themselves are still in the repository.
    - assets/images/bird.png
    - assets/images/pipe.png
    - assets/images/helloasso.svg
    - assets/images/vache.png

  fonts:
    # Not a font the app ever asks for. The web engine hard-codes Roboto as the
    # family it lays text out in before anything else is registered, and fetches
    # it from `https://fonts.gstatic.com/s/roboto/v32/…woff2` — 62 KB from a
    # third origin, awaited before the first frame can paint. It skips that
    # download entirely when the font manifest already declares a family called
    # `Roboto`, which is all this entry is for: the same Latin subset, 22 KB
    # brotli'd, from our own connection.
    #
    # Regenerate with `tool/subset_font.py`. It has to be declared here rather
    # than under `assets:` like the others, because only `fonts:` entries reach
    # FontManifest.json, and the manifest is what the engine checks.
    - family: Roboto
      fonts:
        - asset: assets/google_fonts/Roboto-Regular.ttf

  uses-material-design: true
  generate: true
