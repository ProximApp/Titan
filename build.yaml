targets:
  $default:
    sources:
      - lib/**
      - swaggers/**
      - $package$
    builders:
      swagger_dart_code_generator:
        options:
          input_folder: "swaggers/"
          output_folder: "lib/generated/"
          input_urls:
            - url: "https://hyperion.myemapp.dev.proximapp.fr/openapi.json"
          separate_models: true
          import_paths:
            - 'package:titan/tools/date_time_json.dart'
          scalars:
            date-time:
              type: DateTime
              deserialize: dateTimeFromJson
              serialize: dateTimeToJson
          # Optional fields with a server-side default (e.g. `post_to_feed: bool = False`)
          # are generated as nullable in Dart. Serializing them as an explicit `null`
          # makes Pydantic reject the body with a 422 instead of applying the default,
          # so unset fields must be omitted from the payload entirely.
          include_if_null: false
          default_values_map:
            - type_name: int
              default_value: '0'
            - type_name: String
              default_value: ''
            - type_name: bool
              default_value: 'false'
            - type_name: 'List'
              default_value: '[]'
            - type_name: 'Map'
              default_value: '{}'
            - type_name: 'double'
              default_value: '0.0'
