name: Test
# https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-nodejs-or-python?langId=py#requirements-file

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Remove ^ to fix flutter version parsing
      - name: Fix Flutter Version in Pubspec
        run: |
          sed -i 's/flutter: ^/flutter: /' pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Test project
        run: flutter test --flavor prod --dart-define=flavor=prod --dart-define=APP_ID_PREFIX=test --dart-define=APP_NAME=MyEMApp --dart-define=BACKEND_HOST=https://myemapp.com/ --dart-define=TITAN_URL=https://myemapp.com/ --coverage

      - name: Coverage report and threshold gate
        env:
          COVERAGE_MIN: "28" # ratchet floor; raise as coverage grows
        run: |
          dart run tool/coverage_report.dart \
            --min=$COVERAGE_MIN \
            --summary="$GITHUB_STEP_SUMMARY" \
            --lcov-out=coverage/lcov.filtered.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: coverage/lcov.filtered.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.filtered.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
